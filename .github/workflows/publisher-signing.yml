name: Publisher signing (approval required; no release)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openlit-publisher-signing
  cancel-in-progress: false

jobs:
  qualify:
    if: github.repository == 'mgkwill/lit' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release.yml
    # No secrets are passed to the five native build/test jobs.

  sign:
    name: Approve publisher key access
    needs: qualify
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install checksum-pinned Minisign
        run: python -B tools/release/fetch_minisign.py "$RUNNER_TEMP/minisign" >> "$GITHUB_PATH"
      - name: Download only this run's qualification artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: openlit-*
          path: ${{ runner.temp }}/qualification
      - name: Check native receipts and assemble the five archives
        run: |
          python -B tools/release/ci_minisign.py prepare "$RUNNER_TEMP/publisher-candidate" \
            --downloads "$RUNNER_TEMP/qualification" --commit "$GITHUB_SHA" > "$RUNNER_TEMP/assembly.json"
      - name: Sign with the approved publisher key
        env:
          OPENLIT_MINISIGN_SECRET_KEY: ${{ secrets.OPENLIT_MINISIGN_SECRET_KEY }}
          OPENLIT_MINISIGN_PASSWORD: ${{ secrets.OPENLIT_MINISIGN_PASSWORD }}
        run: |
          python -B tools/release/ci_minisign.py sign "$RUNNER_TEMP/publisher-candidate" \
            --public-key keys/openlit.pub --commit "$GITHUB_SHA" > "$RUNNER_TEMP/signing.json"
      - name: Verify publisher signatures and reject tampering
        run: |
          python -B tools/release/ci_minisign.py verify "$RUNNER_TEMP/publisher-candidate" \
            --public-key keys/openlit.pub --commit "$GITHUB_SHA" \
            --wrong-public-key "$RUNNER_TEMP/qualification/openlit-aarch64-apple-darwin/signed-aarch64-apple-darwin.pub" \
            > "$RUNNER_TEMP/publisher-verification.json"
      - name: Stage public output files
        run: |
          mkdir "$RUNNER_TEMP/publisher-output"
          cp -R "$RUNNER_TEMP/publisher-candidate" "$RUNNER_TEMP/publisher-output/bundle"
          cp "$RUNNER_TEMP/assembly.json" "$RUNNER_TEMP/signing.json" "$RUNNER_TEMP/publisher-verification.json" keys/openlit.pub "$RUNNER_TEMP/publisher-output/"
      - name: Retain verified signed candidate only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openlit-0.1.0-publisher-signed
          path: ${{ runner.temp }}/publisher-output/
          if-no-files-found: error
          retention-days: 14
      - name: Record publication boundary
        run: |
          printf '## Publisher signing complete\n\nSource: %s\n\nAll signatures and rejection checks passed. No tag or release was created. Publication requires separate approval.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
