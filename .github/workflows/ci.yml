name: CI

on:
  push:
  pull_request:

jobs:
  queue-coordinator:
    name: Queue coordinator on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test durable hosted queue recovery
        run: |
          python3 tests/github_queue_coordinator_regression.py
          python3 tests/task_broker_regression.py
          python3 tests/github_app_credentials_regression.py
          python3 tests/task_broker_failover_regression.py
          python3 tests/task_broker_replica_regression.py
          python3 tests/task_broker_quorum_regression.py

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Build
        run: cargo build --verbose

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test -- --test-threads=1 --verbose

      - name: Build release
        run: cargo build --release

      - name: Generate docs
        run: cargo doc --no-deps
