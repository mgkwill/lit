name: Source release checks
on:
  push:
    branches:
      - main
      - 'openlit-install-qualification-*'
  pull_request:
    paths:
      - 'install.sh'
      - 'install.ps1'
      - 'tests/install_script_regression.py'
      - 'tests/dependency_notice_regression.py'
      - 'tests/provenance_export_regression.py'
      - 'tests/release_signing_regression.py'
      - 'tests/minisign_release_regression.py'
      - 'tests/ci_minisign_regression.py'
      - 'tests/release_attribution_regression.py'
      - 'LICENSE'
      - 'NOTICE.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/qualify_minisign_archive.py'
      - 'tests/qualify_release_archive.py'
      - 'tools/release/**'
      - 'tools/release_dependency_notices.py'
      - 'audits/evidence/tools/**'
      - '.github/workflows/install.yml'
      - '.github/workflows/publisher-signing.yml'
      - '.github/workflows/release.yml'
      - 'keys/openlit.pub'
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B tests/install_script_regression.py
      - run: python -B tests/dependency_notice_regression.py
      - run: python -B tests/provenance_export_regression.py
      - name: Locate Windows SDK for native signature rejection test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $Tool) { throw 'Windows SDK SignTool not found' }
          $Tool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -B tests/release_signing_regression.py
      - name: Install pinned Minisign for disposable-key tests
        shell: bash
        run: python -B tools/release/fetch_minisign.py "$RUNNER_TEMP/minisign" >> "$GITHUB_PATH"
      - run: python -B tests/minisign_release_regression.py
      - run: python -B tests/ci_minisign_regression.py
      - run: python -B tests/release_attribution_regression.py
