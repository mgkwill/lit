name: Minisign candidate qualification (disposable keys)

on:
  workflow_call:
  workflow_dispatch:
  # Qualification only. Publishing requires a separately approved workflow.
  push:
    branches:
      - 'lit-release-qualification-*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: 0.1.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: lit
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: lit
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: lit.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: lit
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: lit

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Check signature verification vectors
        run: cargo test --locked --release --target ${{ matrix.target }} --test signature_vectors

      - name: Package artifact (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir release-package
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} LICENSE THIRD_PARTY_NOTICES.txt release-package/
          tar -czf "openlit-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" -C release-package ${{ matrix.artifact }} LICENSE THIRD_PARTY_NOTICES.txt

      - name: Package artifact (windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -LiteralPath 'target/${{ matrix.target }}/release/${{ matrix.artifact }}', 'LICENSE', 'THIRD_PARTY_NOTICES.txt' -DestinationPath "openlit-$env:RELEASE_TAG-${{ matrix.target }}.zip"

      - name: Set up Python for package tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify dependency notice inventory
        run: |
          python -B tests/dependency_notice_regression.py
          python -B tools/release_dependency_notices.py --check

      - name: Install pinned Minisign without publisher credentials
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == x86_64-apple-darwin ]]; then
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install minisign
            "$(brew --prefix)/bin/minisign" -v | grep -Fx 'minisign 0.12'
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          else
            python -B tools/release/fetch_minisign.py "$RUNNER_TEMP/minisign" >> "$GITHUB_PATH"
          fi
      - name: Test real signatures and rejection paths
        run: python -B tests/minisign_release_regression.py
      - name: Qualify fresh signed archives using disposable keys
        shell: bash
        run: |
          python -B tests/qualify_minisign_archive.py \
            "openlit-${RELEASE_TAG}-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}" \
            "${{ matrix.target }}" --commit "$GITHUB_SHA" --output "signed-${{ matrix.target }}" > "qualification-${{ matrix.target }}.json"
          cat "qualification-${{ matrix.target }}.json"

      - name: Check the documented quick start
        if: runner.os != 'Windows'
        run: python -B tests/docs_smoke.py target/${{ matrix.target }}/release/lit

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openlit-${{ matrix.target }}
          path: |
            signed-${{ matrix.target }}/*
            signed-${{ matrix.target }}.pub
            qualification-${{ matrix.target }}.json
          if-no-files-found: error
