name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'lit-release-qualification-*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: lit
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: lit
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: lit.exe
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: lit
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: lit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package artifact (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir release-package
          cp target/${{ matrix.target }}/release/${{ matrix.artifact }} LICENSE release-package/
          tar -czf "lit-${RELEASE_TAG}-${{ matrix.target }}.tar.gz" -C release-package ${{ matrix.artifact }} LICENSE

      - name: Package artifact (windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -LiteralPath 'target/${{ matrix.target }}/release/${{ matrix.artifact }}', 'LICENSE' -DestinationPath "lit-$env:RELEASE_TAG-${{ matrix.target }}.zip"

      - name: Set up Python for package tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Qualify the unpacked release binary
        shell: bash
        run: |
          python -B tests/qualify_release_archive.py \
            "lit-${RELEASE_TAG}-${{ matrix.target }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}" \
            "${{ matrix.target }}" > "qualification-${{ matrix.target }}.json"
          cat "qualification-${{ matrix.target }}.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lit-${{ matrix.target }}
          path: |
            lit-${{ github.ref_name }}-${{ matrix.target }}.*
            qualification-${{ matrix.target }}.json
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate asset checksums
        working-directory: artifacts
        run: sha256sum -- *.tar.gz *.zip > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
